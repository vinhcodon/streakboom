name: Deploy landing page

on:
  push:
    branches: [main]
    # The pages are built from the site sources, the app's rig (Peak), the version (tauri.conf.json) and the release notes
    # (CHANGELOG.md, updates/latest.json), so a release or a rig change redeploys the site by itself (ADR-0034).
    paths:
      - "site/**"
      - "scripts/build-site.mjs"
      - "scripts/site/**"
      - "app/src/lib/rig/**"
      - "app/src-tauri/tauri.conf.json"
      - "CHANGELOG.md"
      - "updates/latest.json"
      - "docs/plans/assets/stickers/set-v2/**"   # the sticker pages are built from this folder (ADR-0053)
      - ".github/workflows/pages.yml"
  # once a day, so the download counter (ADR-0052) follows the downloads without anyone doing anything
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # builds Peak for the browser, the pages and the crawler files into _site/, and runs the checks: if one fails
      # nothing is deployed and the site stays as it was
      - name: Build and check the site (_site/)
        run: node scripts/build-site.mjs
        env:
          # the download counter reads the releases from GitHub and the previous ledger from the live site (ADR-0052);
          # if either cannot be read the build fails and the site stays as it was
          STREAKBOOM_DOWNLOADS: live
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # a second copy of the ledger (the first is published with the site), kept by Actions for 90 days. It comes AFTER the
      # deployment: deploy-pages looks for its artifact among the run's artifacts, and a second artifact uploaded before it made
      # one run fail ("No artifacts named github-pages were found", 2026-11-11)
      - uses: actions/upload-artifact@v4
        with:
          name: downloads-ledger
          path: _site/downloads.json
