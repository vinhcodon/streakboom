name: Deploy landing page

on:
  push:
    branches: [main]
    # The pages are built from the site sources, the app's rig (Peak), the version (tauri.conf.json) and the release notes
    # (CHANGELOG.md, updates/latest.json), so a release or a rig change redeploys the site by itself (ADR-0034).
    paths:
      - "site/**"
      - "scripts/build-site.mjs"
      - "scripts/site/**"
      - "app/src/lib/rig/**"
      - "app/src-tauri/tauri.conf.json"
      - "CHANGELOG.md"
      - "updates/latest.json"
      - "docs/plans/assets/stickers/set-v2/**"   # the sticker pages are built from this folder (ADR-0053)
      - "docs/plans/assets/paws/set-duo-4/**"    # and from the four duo stickers that follow it (ADR-0129, ADR-0130)
      - ".github/workflows/pages.yml"
  # once a day, so the download counter (ADR-0052) follows the downloads without anyone doing anything
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read      # the previous download ledger is fetched from the artifact of an earlier run (ADR-0099)

concurrency:
  group: pages
  cancel-in-progress: true

# two jobs (ADR-0162): `build` makes the site and uploads it, `deploy` publishes it. deploy-pages asks GitHub for the uploaded artifact, and asked a
# few hundred milliseconds after the upload it has been told there is none (2026-11-11, 11-25, 11-26); the second job starts a few seconds later,
# tries once more if it still fails, and can be re-run alone ("Re-run failed jobs")
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # the previous download ledger, from the copy the last run kept in Actions (artifact downloads-ledger, 90 days), so the build does not ask
      # the live site, which Cloudflare's bot protection may turn away (ADR-0099, W-64). No artifact (the first run, or it expired): the build
      # falls back to the live site as before
      - name: Fetch the previous download ledger from Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=downloads-ledger&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | .[0].id // empty' || true)
          if [ -n "$id" ]; then
            mkdir -p previous-ledger
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > previous-ledger/ledger.zip && unzip -o -q previous-ledger/ledger.zip -d previous-ledger; then
              echo "previous ledger: artifact $id"
            else
              echo "::warning::could not read the artifact $id; the live site will be asked"
              rm -f previous-ledger/downloads.json
            fi
          else
            echo "::warning::no earlier ledger artifact; the live site will be asked"
          fi
      # builds Peak for the browser, the pages and the crawler files into _site/, and runs the checks: if one fails
      # nothing is deployed and the site stays as it was
      - name: Build and check the site (_site/)
        run: node scripts/build-site.mjs
        env:
          # the download counter reads the releases from GitHub and the previous ledger from the live site (ADR-0052);
          # if either cannot be read the build fails and the site stays as it was
          STREAKBOOM_DOWNLOADS: live
          STREAKBOOM_PREVIOUS_LEDGER: previous-ledger/downloads.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # a second copy of the ledger (the first is published with the site), kept by Actions for 90 days. It is kept here, in the build job, so a day
      # is not lost from the history when the deployment fails (the days 2026-11-25 and 11-26 were)
      - uses: actions/upload-artifact@v4
        with:
          name: downloads-ledger
          path: _site/downloads.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.again.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      # no continue-on-error: if this one fails too, the run fails
      - id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # the LIVE pages must carry only what the privacy page says (ADR-0096): Cloudflare sits in front of the site and can add scripts, headers or
      # cookies after the build checked its own files. Last, after the deploy, so a failure is an alert and undoes nothing
      - name: Check the live site against the privacy page
        run: sleep 20 && node scripts/site/livecheck.mjs

      # IndexNow (ADR-0124): tell Bing and the other engines that take part which addresses to read again. After a push or a manual run only (not the
      # daily schedule, which changes only the download number). It sends public addresses and a public key; a failure is a warning, never a failed deploy
      - name: Tell the search engines (IndexNow)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: node scripts/site/indexnow.mjs
