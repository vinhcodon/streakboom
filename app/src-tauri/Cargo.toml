[package]
name = "streakboom"
version = "0.8.0"
description = "Streakboom desktop pet"
authors = ["streakboom"]
edition = "2024"

[lib]
name = "streakboom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
ureq = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_Media", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading"] }

[features]
# A developer build that adds "Terrain overlay (dev)" to the tray menu: a window that draws what Peak believes about the
# screen (spec/10, TT-1). Never part of a release.
terrain-overlay = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

