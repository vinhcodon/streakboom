[package]
name = "streakboom"
version = "0.10.0"
description = "Streakboom desktop pet"
authors = ["streakboom"]
license = "MIT"
edition = "2024"

[lib]
name = "streakboom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3" # the store of each platform is chosen in its own table below (ADR-0132)
ureq = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_Media", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security"] }

# macOS (ADR-0132, the spike; never compiled on a Mac yet, V-169): the Keychain for the key, and the transparent window that the platform
# needs the private API for (the matching `app.macOSPrivateApi` is in `tauri.macos.conf.json`, merged on macOS only).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
tauri = { version = "2", features = ["macos-private-api"] }

[features]
# A developer build that adds "Terrain overlay (dev)" to the tray menu: a window that draws what Peak believes about the
# screen (spec/10, TT-1). Never part of a release.
terrain-overlay = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

