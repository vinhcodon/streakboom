c9d0da" stroke-width="1"/><ellipse cx="90" cy="60" rx="24" ry="21" fill="#4b5160" stroke="#e9eef5" stroke-width="2.2" stroke-linejoin="round" /><ellipse cx="110" cy="68" rx="12" ry="9" fill="#fdfdfd" stroke="#c9d0da" stroke-width="1"/><path d="M92 42 Q103 52 109 60" fill="none" stroke="#fdfdfd" stroke-width="7" stroke-linecap="round"/><path d="M72 44 Q66 24 82 18 Q90 18 92 24 Q88 28 90 38 Q84 46 76 50Z" fill="#4b5160" stroke="#e9eef5" stroke-width="2.2" stroke-linejoin="round" /><path d="M76 40 Q74 28 82 24" fill="none" stroke="#3a3f4b" stroke-width="4.5" stroke-linecap="round"/><ellipse cx="100" cy="51" rx="4" ry="2.8" fill="#c98f4a"/><ellipse cx="102" cy="59" rx="6" ry="7.6" fill="#2b2220"/><ellipse cx="104" cy="56.2" rx="2.6" ry="2.6" fill="#fff"/><ellipse cx="100" cy="62" rx="1.2" ry="1.2" fill="#fff"/><ellipse cx="96" cy="70" rx="6.5" ry="3.8" fill="#f4b3b3" fill-opacity="0.8"/><path d="M117 64.5 Q123 66 121 70 Q118 72 115.5 69.5Z" fill="#1f2128"/><path d="M113 73 Q107 77 102 74" fill="none" stroke="#7a4b3a" stroke-width="1.8" stroke-linecap="round"/></g></g><text x="20" y="388" font-size="13" font-weight="700" fill="#2b2220">What changed against the first (Gemini) drawing</text><text x="20" y="408" font-size="12" fill="#2b2220">A lighter dark body and a light rim line round every dark shape (it no longer vanishes on a dark ground).</text><text x="20" y="424" font-size="12" fill="#2b2220">Big ears with the tips folded, a white blaze and muzzle, a neck ruff, back legs and a bushy tail (a dog, not a penguin).</text><text x="20" y="440" font-size="12" fill="#2b2220">Real white paws with toes; a small tongue and tan brow spots so the face reads at 32 px; the correct xmlns.</text><text x="20" y="470" font-size="13" font-weight="700" fill="#2b2220">Palette</text><g transform="translate(20,490)"><rect width="26" height="22" rx="4" fill="#4b5160" stroke="#bbb" stroke-width="1"/><text x="34" y="16" font-size="12" fill="#2b2220">body #4b5160</text></g><g transform="translate(170,490)"><rect width="26" height="22" rx="4" fill="#3a3f4b" stroke="#bbb" stroke-width="1"/><text x="34" y="16" font-size="12" fill="#2b2220">shade #3a3f4b</text></g><g transform="translate(320,490)"><rect width="26" height="22" rx="4" fill="#e9eef5" stroke="#bbb" stroke-width="1"/><text x="34" y="16" font-size="12" fill="#2b2220">rim #e9eef5</text></g><g transform="translate(20,526)"><rect width="26" height="22" rx="4" fill="#fdfdfd" stroke="#bbb" stroke-width="1"/><text x="34" y="16" font-size="12" fill="#2b2220">white</text></g><g transform="translate(170,526)"><rect width="26" height="22" rx="4" fill="#c98f4a" stroke="#bbb" stroke-width="1"/><text x="34" y="16" font-size="12" fill="#2b2220">brow tan</text></g><g transform="translate(320,526)"><rect width="26" height="22" rx="4" fill="#1f2128" stroke="#bbb" stroke-width="1"/><text x="34" y="16" font-size="12" fill="#2b2220">nose</text></g></svg>