<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" font-family="Segoe UI, Arial, sans-serif">
  <!-- Draft character sheet for the sticker test (plan sticker-test.md, ST-2).
       Drawn from the numbers in app/src/lib/rig/keys.ts (STAND_F) and draw.ts, not from a screenshot of the running cat (V-92).
       Front view approved by the author 2026-11-10; the side view (STAND_S) was added in v0.2. Sit, stretch and loaf bodies are not drawn. -->
  <rect width="640" height="800" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#2b2220">Peak, character sheet (draft v0.2, 2026-11-10)</text>

  <!-- Rest face, scale 2.6 (rig units 0..120) -->
  <g transform="translate(20,45) scale(2.6)">
    <ellipse cx="60" cy="115" rx="32" ry="4.5" fill="#000" fill-opacity="0.08"/>
    <path d="M86 100 Q110 100 108 74" fill="none" stroke="#e9a94a" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="60" cy="92" rx="34" ry="24" fill="#f6c26b"/>
    <ellipse cx="60" cy="101" rx="19" ry="13" fill="#fff1d6"/>
    <ellipse cx="46" cy="110" rx="11" ry="6.5" fill="#f6c26b"/>
    <ellipse cx="74" cy="110" rx="11" ry="6.5" fill="#f6c26b"/>
    <polygon points="26,52 30,22 54,38" fill="#f6c26b"/>
    <polygon points="31,48 34,30 48,40" fill="#f4a7a7"/>
    <polygon points="94,52 90,22 66,38" fill="#f6c26b"/>
    <polygon points="89,48 86,30 72,40" fill="#f4a7a7"/>
    <ellipse cx="60" cy="64" rx="42" ry="34" fill="#f6c26b"/>
    <g stroke="#e9a94a" stroke-width="2.6" stroke-linecap="round">
      <line x1="53" y1="36" x2="53" y2="43"/><line x1="60" y1="34" x2="60" y2="43"/><line x1="67" y1="36" x2="67" y2="43"/>
    </g>
    <ellipse cx="44" cy="66" rx="7.5" ry="9.5" fill="#2b2220"/>
    <ellipse cx="46.6" cy="62.5" rx="3.4" ry="3.4" fill="#fff"/><ellipse cx="41.6" cy="70" rx="1.5" ry="1.5" fill="#fff"/>
    <ellipse cx="76" cy="66" rx="7.5" ry="9.5" fill="#2b2220"/>
    <ellipse cx="78.6" cy="62.5" rx="3.4" ry="3.4" fill="#fff"/><ellipse cx="73.6" cy="70" rx="1.5" ry="1.5" fill="#fff"/>
    <ellipse cx="30" cy="78" rx="8" ry="4.6" fill="#f59e9e" fill-opacity="0.6"/>
    <ellipse cx="90" cy="78" rx="8" ry="4.6" fill="#f59e9e" fill-opacity="0.6"/>
    <polygon points="56.5,74 63.5,74 60,78.5" fill="#e8828a"/>
    <g fill="none" stroke="#7a4b3a" stroke-width="1.9" stroke-linecap="round">
      <path d="M60 78.5 Q56 83.5 51 80"/><path d="M60 78.5 Q64 83.5 69 80"/>
    </g>
  </g>

  <!-- Happy / purr eyes (closed arcs) and the sad ears-down face are listed below, not drawn: the author decides the set first. -->
  <g transform="translate(350,45) scale(1.2)">
    <ellipse cx="60" cy="64" rx="42" ry="34" fill="#f6c26b"/>
    <polygon points="26,52 30,22 54,38" fill="#f6c26b"/><polygon points="94,52 90,22 66,38" fill="#f6c26b"/>
    <polygon points="31,48 34,30 48,40" fill="#f4a7a7"/><polygon points="89,48 86,30 72,40" fill="#f4a7a7"/>
    <ellipse cx="60" cy="64" rx="42" ry="34" fill="#f6c26b"/>
    <g fill="none" stroke="#2b2220" stroke-width="3" stroke-linecap="round">
      <path d="M36 70 Q44 59 52 70"/><path d="M68 70 Q76 59 84 70"/>
    </g>
    <ellipse cx="30" cy="78" rx="8" ry="4.6" fill="#f59e9e" fill-opacity="0.85"/><ellipse cx="90" cy="78" rx="8" ry="4.6" fill="#f59e9e" fill-opacity="0.85"/>
    <polygon points="56.5,74 63.5,74 60,78.5" fill="#e8828a"/>
    <path d="M52 79 Q60 91 68 79 Z" fill="#d9696f"/>
  </g>
  <text x="350" y="170" font-size="12" fill="#2b2220">happy (celebrate, sticker 7): closed arcs, open mouth</text>

  <!-- Palette -->
  <g font-size="12" fill="#2b2220">
    <text x="350" y="205" font-weight="700">Palette</text>
    <rect x="350" y="212" width="26" height="18" fill="#f6c26b"/><text x="382" y="226">fur #f6c26b</text>
    <rect x="350" y="236" width="26" height="18" fill="#e9a94a"/><text x="382" y="250">stripes, tail #e9a94a</text>
    <rect x="350" y="260" width="26" height="18" fill="#fff1d6" stroke="#ccc"/><text x="382" y="274">belly #fff1d6</text>
    <rect x="350" y="284" width="26" height="18" fill="#f4a7a7"/><text x="382" y="298">inner ear #f4a7a7</text>
    <rect x="490" y="212" width="26" height="18" fill="#2b2220"/><text x="522" y="226">ink #2b2220</text>
    <rect x="490" y="236" width="26" height="18" fill="#f59e9e"/><text x="522" y="250">cheek #f59e9e</text>
    <rect x="490" y="260" width="26" height="18" fill="#e8828a"/><text x="522" y="274">nose #e8828a</text>
    <rect x="490" y="284" width="26" height="18" fill="#7a4b3a"/><text x="522" y="298">mouth #7a4b3a</text>
  </g>


  <!-- Side view, STAND_S (the walk, the stretch and the climb are side-on). Facing right. Far ear, far eye and far cheek are hidden in the rig. -->
  <text x="20" y="392" font-size="14" font-weight="700" fill="#2b2220">Side view (facing right)</text>
  <g transform="translate(20,400) scale(2.6)">
    <ellipse cx="60" cy="115" rx="34" ry="4.5" fill="#000" fill-opacity="0.08"/>
    <path d="M28 90 Q8 88 12 60" fill="none" stroke="#e9a94a" stroke-width="9" stroke-linecap="round"/>
    <g stroke="#e9a94a" stroke-width="11" stroke-linecap="round"><line x1="51" y1="103.5" x2="51" y2="109.5"/><line x1="87" y1="103.5" x2="87" y2="109.5"/></g>
    <ellipse cx="56" cy="88" rx="34" ry="22" fill="#f6c26b"/>
    <ellipse cx="58" cy="99" rx="20" ry="9" fill="#fff1d6"/>
    <g stroke="#f6c26b" stroke-width="11" stroke-linecap="round"><line x1="37" y1="103.5" x2="37" y2="109.5"/><line x1="73" y1="103.5" x2="73" y2="109.5"/></g>
    <polygon points="76,52 80,26 98,46" fill="#f6c26b"/>
    <polygon points="81,48 83,34 94,46" fill="#f4a7a7"/>
    <ellipse cx="92" cy="68" rx="27" ry="25" fill="#f6c26b"/>
    <g stroke="#e9a94a" stroke-width="2.6" stroke-linecap="round"><line x1="87" y1="46" x2="87" y2="52"/><line x1="93" y1="45" x2="93" y2="53"/></g>
    <ellipse cx="102" cy="66" rx="6.5" ry="8.5" fill="#2b2220"/>
    <ellipse cx="104.3" cy="62.9" rx="2.9" ry="2.9" fill="#fff"/><ellipse cx="100" cy="69.6" rx="1.3" ry="1.3" fill="#fff"/>
    <ellipse cx="94" cy="79" rx="7" ry="4" fill="#f59e9e" fill-opacity="0.6"/>
    <polygon points="116.5,70.5 119.5,70.5 118,73.5" fill="#e8828a"/>
    <path d="M115 78 Q112 82 108 79.5" fill="none" stroke="#7a4b3a" stroke-width="1.9" stroke-linecap="round"/>
  </g>
  <g font-size="12" fill="#2b2220">
    <text x="350" y="420" font-weight="700">Side view notes</text>
    <text x="350" y="440">Head 27 x 25, smaller than the front head</text>
    <text x="350" y="458">(42 x 34): the rig redraws it side-on.</text>
    <text x="350" y="482">One eye, one ear, tail curled up behind,</text>
    <text x="350" y="500">legs as thick rounded strokes (11 wide).</text>
    <text x="350" y="524">Use it for: good morning (stretch), walk,</text>
    <text x="350" y="542">any sticker that needs a profile.</text>
    <text x="350" y="566">Never blend with the front view: a half</text>
    <text x="350" y="584">turn looks wrong (engine comment, spec/06 7.1).</text>
  </g>

  <!-- Rules -->
  <g font-size="12" fill="#2b2220">
    <text x="20" y="752" font-weight="700">Rules for every sticker (spec/06 7.3)</text>
    <text x="20" y="770">Head 42 x 34 over body 34 x 24; round eyes with two highlights; ears triangular with pink inner; three stripes;</text>
    <text x="20" y="786">flat colors only (Zalo: no 3D, no square-cornered background); front or side view only; at most 4 words of text.</text>
  </g>
</svg>
