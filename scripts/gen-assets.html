<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peak asset generator (dev only)</title>
<style>
  body { font: 14px system-ui; margin: 16px; background: #eee; }
  img { display: block; margin: 8px 0; border: 1px solid #ccc; background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0/16px 16px; max-width: 100%; }
  button { font: inherit; padding: 6px 14px; }
  #log { white-space: pre; }
</style>
</head>
<body>
<p>Draws the share image and icons with the app's own rig (site/peak/), then saves them into the repo.
Run from <code>node scripts/site-dev.mjs</code>, open <code>/__gen</code>.</p>
<button id="save">Save all</button>
<div id="log"></div>
<div id="out"></div>

<script type="module">
import { Rig } from "/peak/engine.js";
import { drawFrame } from "/peak/draw.js";
import { POSE_KEYS } from "/peak/keys.js";

const GOLD = "#f5b83d";
const INK = "#3b2f1e";

const canvas = (w, h) => Object.assign(document.createElement("canvas"), { width: w, height: h });

// Peak, standing and smiling, settled, on a transparent canvas of 120*scale px.
function peak(scale) {
  const rig = new Rig();
  rig.setPose("idle", 1, 0, false);
  for (let i = 0; i < 600; i++) rig.step(1 / 60);
  const c = canvas(120 * scale, 120 * scale);
  const x = c.getContext("2d");
  x.setTransform(scale, 0, 0, scale, 0, 0);
  drawFrame(x, rig.frame());
  return c;
}

function bg(x, w, h) {
  const g = x.createRadialGradient(w * 0.35, h * 0.3, 0, w * 0.35, h * 0.3, Math.max(w, h) * 0.9);
  g.addColorStop(0, "#ffefc6");
  g.addColorStop(1, GOLD);
  x.fillStyle = g;
  x.fillRect(0, 0, w, h);
}

// ---- Peak's face (option C): the rig's own head, ears and eyes without the body. Drawn natively
// at every size, as vectors, so a 16px favicon is crisp instead of a shrunken big picture.
const FUR = "#f6c26b", DARK = "#e9a94a", EDGE = "#b9781a", PINK = "#f4a7a7", FACE_INK = "#2b2220";
const ell = (c, x, y, rx, ry) => { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); };
const tri = (c, a, b, d, fill) => { c.beginPath(); c.moveTo(...a); c.lineTo(...b); c.lineTo(...d); c.closePath(); c.fillStyle = fill; c.fill(); };
const triEdge = (c, a, b, d, lw) => { c.beginPath(); c.moveTo(...a); c.lineTo(...b); c.lineTo(...d); c.closePath(); c.lineWidth = lw; c.strokeStyle = EDGE; c.stroke(); };

function face(c, detail, outline) {
  const lw = outline;
  c.lineJoin = "round"; c.lineCap = "round";
  if (lw) {
    // edges first, so the fill covers the inner half and leaves a clean outline
    triEdge(c, [24, 54], [29, 18], [56, 38], lw); triEdge(c, [96, 54], [91, 18], [64, 38], lw);
    ell(c, 60, 64, 42, 34); c.lineWidth = lw; c.strokeStyle = EDGE; c.stroke();
  }
  tri(c, [24, 54], [29, 18], [56, 38], FUR); tri(c, [96, 54], [91, 18], [64, 38], FUR);
  ell(c, 60, 64, 42, 34); c.fillStyle = FUR; c.fill();
  tri(c, [31, 47], [33, 29], [48, 40], PINK); tri(c, [89, 47], [87, 29], [72, 40], PINK);
  if (detail) {
    c.strokeStyle = DARK; c.lineWidth = 3;
    for (const x of [53, 60, 67]) { c.beginPath(); c.moveTo(x, 36); c.lineTo(x, 44); c.stroke(); }
  }
  for (const x of [43, 77]) { // eyes a touch larger than the real Peak so they read at 16px
    ell(c, x, 67, 9, 11); c.fillStyle = FACE_INK; c.fill();
    ell(c, x + 3.2, 63, 3.6, 3.6); c.fillStyle = "#fff"; c.fill();
  }
  c.fillStyle = "rgba(244,140,140,.75)";
  ell(c, 31, 79, 7.5, 4.8); c.fill(); ell(c, 89, 79, 7.5, 4.8); c.fill();
  c.fillStyle = "#e98f8f"; c.beginPath(); c.moveTo(56, 78); c.lineTo(64, 78); c.lineTo(60, 83); c.closePath(); c.fill();
  if (detail) {
    c.strokeStyle = "#7a4b3a"; c.lineWidth = 2.6; c.beginPath();
    c.moveTo(60, 83); c.quadraticCurveTo(57, 89, 52, 86); c.moveTo(60, 83); c.quadraticCurveTo(63, 89, 68, 86); c.stroke();
  }
}

// favicon: the face fills the whole square, no tile, transparent around it
function favicon(size) {
  const c = canvas(size, size);
  const x = c.getContext("2d");
  const k = size / 92;
  x.scale(k, k); x.translate(-14, -13);
  face(x, size >= 28, size < 24 ? 5 : 4.2);
  return c;
}

// app / touch icon: the face on a warm dark tile, so the golden fur stands out. radius 0 = full bleed (apple-touch)
function tileIcon(size, radius) {
  const c = canvas(size, size);
  const x = c.getContext("2d");
  if (radius) { x.beginPath(); x.roundRect(0, 0, size, size, size * radius); x.clip(); }
  const g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, "#54412a"); g.addColorStop(1, "#2c2217");
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  const k = (size * 0.8) / 92;
  x.translate(size * 0.1, size * 0.11);
  x.scale(k, k); x.translate(-14, -13);
  face(x, true, 4.2);
  return c;
}

function share() {
  const w = 1200, h = 630;
  const c = canvas(w, h);
  const x = c.getContext("2d");
  bg(x, w, h);
  // soft circle behind the cat
  x.fillStyle = "rgba(255,255,255,.35)";
  x.beginPath(); x.arc(310, 330, 250, 0, Math.PI * 2); x.fill();
  x.drawImage(peak(5), 10, 30, 600, 600);
  x.fillStyle = INK;
  x.textBaseline = "alphabetic";
  x.font = "800 92px 'Segoe UI', system-ui, sans-serif";
  x.fillText("Streakboom", 600, 255);
  x.font = "600 40px 'Segoe UI', system-ui, sans-serif";
  x.fillText("Peak, chú mèo trên màn hình", 604, 335);
  x.font = "400 38px 'Segoe UI', system-ui, sans-serif";
  x.fillStyle = "rgba(59,47,30,.85)";
  x.fillText("A desktop pet cat for Windows", 604, 390);
  // pill
  x.fillStyle = INK;
  x.beginPath(); x.roundRect(604, 440, 575, 62, 31); x.fill();
  x.fillStyle = "#fff4d6";
  x.font = "600 30px 'Segoe UI', system-ui, sans-serif";
  x.fillText("Free app · Open source · No AI needed", 629, 482);
  return c;
}

const files = {
  "og-image.jpg": share(),
  "peak-logo.png": favicon(96), // the header logo, shown at 32 css px
  "favicon-16.png": favicon(16),
  "favicon-32.png": favicon(32),
  "apple-touch-icon.png": tileIcon(180, 0),
  "peak-icon-1024.png": tileIcon(1024, 0.22),
};

const out = document.getElementById("out");
for (const [name, c] of Object.entries(files)) {
  const label = document.createElement("div");
  label.textContent = `${name} (${c.width}x${c.height})`;
  const img = new Image();
  img.src = c.toDataURL(name.endsWith(".jpg") ? "image/jpeg" : "image/png", 0.9);
  if (c.width < 100) img.style.width = "128px", img.style.imageRendering = "pixelated";
  else if (c.width > 600) img.style.width = "600px";
  out.append(label, img);
}

document.getElementById("save").onclick = async () => {
  const log = document.getElementById("log");
  log.textContent = "";
  for (const [name, c] of Object.entries(files)) {
    const blob = await new Promise((r) => (name.endsWith(".jpg") ? c.toBlob(r, "image/jpeg", 0.9) : c.toBlob(r, "image/png")));
    const res = await fetch("/__save/" + name, { method: "POST", body: blob });
    log.textContent += `${name}: ${await res.text()} (${blob.size} bytes)\n`;
  }
};
</script>
</body>
</html>
