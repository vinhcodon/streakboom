<!doctype html>
<html><head><meta charset="utf-8"><title>test scene typing</title>
<style>
body{margin:0;height:100vh;background:#f6f7fb;font:16px Segoe UI,sans-serif;color:#223}
.top{padding:24px 40px}
.dock{position:absolute;left:0;right:0;bottom:50px;height:90px;padding:12px 40px;background:#e8ebf5;border-top:1px solid #c9cfe2}
textarea{width:100%;height:60px;font:18px Consolas,monospace;padding:8px;box-sizing:border-box}
</style></head><body>
<div class="top"><h2>Notes</h2><p>A page with a text box in a dock at the bottom of the screen, to test the typing lane.</p></div>
<div class="dock"><textarea id="t" autofocus></textarea></div>
<script>document.getElementById('t').focus();document.addEventListener('click',function(){document.getElementById('t').focus()})</script>
</body></html>
